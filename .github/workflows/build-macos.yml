name: Build macOS

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      BUILD_CONFIG: "${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.window }}_${{ matrix.precision_opt == '' && 'double' || matrix.precision_opt == '--enable-float' && 'float' || matrix.precision_opt == '--enable-long-double' && 'long-double' || 'unknown' }}_${{ matrix.openmp == 1 && 'openmp' || 'singlethread' }}"
      CPPFLAGS: "-I/opt/homebrew/include"
      LDFLAGS: "-L/opt/homebrew/lib"
    name: "${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.window }}-${{ matrix.precision_opt == '' && 'double' || matrix.precision_opt == '--enable-float' && 'float' || matrix.precision_opt == '--enable-long-double' && 'long-double' || 'unknown' }}-${{ matrix.openmp == 1 && 'openmp' || 'singlethread' }}"
    strategy:
      matrix:
        os: ["macos-26"]
        compiler: ["gcc"]
        window: ["kaiserbessel"]
        precision_opt: ["", "--enable-float", "--enable-long-double"]
        openmp: [0]
        build_octave: [0] # TODO: Re-activate Octave build and tests.
        build_julia: [1]
        include:
          # Clang
          - os: "macos-26"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 0
            build_octave: 0
            build_julia: 1
          # Homebrew's Clang
          - os: "macos-26"
            compiler: "clang-homebrew"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 0 # TODO: Re-activate openmp.
            build_octave: 0
            build_julia: 1
          # GCC 13
          - os: "macos-26"
            compiler: "gcc-13"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 0
            build_octave: 0
            build_julia: 1
          # GCC 14
          - os: "macos-26"
            compiler: "gcc-14"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 0
            build_octave: 0
            build_julia: 1
          # GCC 15
          - os: "macos-26"
            compiler: "gcc-15"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 0
            build_octave: 0
            build_julia: 1
    steps:    
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        persist-credentials: false

    - uses: gerlero/brew-install@b7bdd6875207fdf3b7ebd0ecc5cf8da6e657eca2 # v1
      with:
        cache: true
        packages: |
          autoconf
          automake
          libtool
          cmake
          fftw
          cunit
          octave
          llvm

    - name: Set up Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v2

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13
      
    - name: Set up compiler
      shell: bash
      env:
        COMPILER: ${{ matrix.compiler }}
      run: |
        if [ "${COMPILER}" = "clang" ]; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        elif [ "${COMPILER}" = "gcc" ]; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        elif [ "${COMPILER}" = "clang-homebrew" ]; then
          echo "CC=/opt/homebrew/opt/llvm/bin/clang" >> $GITHUB_ENV
          echo "CXX=/opt/homebrew/opt/llvm/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib $LDFLAGS" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include $CPPFLAGS" >> $GITHUB_ENV          
        elif echo "${COMPILER}" | grep -qE '^gcc-[0-9]+$'; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          GCC_VERSION=$(echo "${COMPILER}" | sed 's/gcc-//')
          echo "CXX=g++-${GCC_VERSION}" >> $GITHUB_ENV
        else
          echo "Error: Unknown compiler '${COMPILER}'. Supported compilers are: gcc, clang, gcc-snapshot, gcc-<version>" >&2
          exit 1
        fi

    # - name: Cache CodSpeed integration library
    #   uses: actions/cache@v4
    #   id: cache-codspeed
    #   with:
    #     path: codspeed-cpp
    #     key: codspeed-cpp-${{ matrix.os }}

    # - name: Checkout CodSpeed integration library
    #   if: steps.cache-codspeed.outputs.cache-hit != 'true'
    #   uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
    #   with:
    #     persist-credentials: false
    #     repository: CodSpeedHQ/codspeed-cpp
    #     path: codspeed-cpp
    #     submodules: recursive

    # - name: Configure CMake for CodSpeed integration library
    #   if: steps.cache-codspeed.outputs.cache-hit != 'true'
    #   run: |
    #     cd codspeed-cpp/google_benchmark
    #     cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON -DCODSPEED_MODE=simulation -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_EXTENSIONS=OFF.

    # - name: Build CodSpeed integration library
    #   if: steps.cache-codspeed.outputs.cache-hit != 'true'
    #   run: |
    #     cd codspeed-cpp/google_benchmark
    #     cmake --build . -v
    
    - name: Set up Octave
      if: matrix.build_octave == '1'
      run: |
        echo "OCTAVEDIR=/usr" >> $GITHUB_ENV
        echo "OCTAVE=octave" >> $GITHUB_ENV
        
    - name: Bootstrap
      run: ./bootstrap.sh
    
    - name: Configure
      shell: bash
      env:
        WINDOW: ${{ matrix.window }}
        OPENMP: ${{ matrix.openmp }}
        PRECISION_OPT: ${{ matrix.precision_opt }}
        BUILD_OCTAVE: ${{ matrix.build_octave }}
        BUILD_JULIA: ${{ matrix.build_julia }}
      run: |
        AGNOSTIC_FLAGS=""
        [ "${WINDOW}" = "kaiserbessel" ] && AGNOSTIC_FLAGS="window:1" || AGNOSTIC_FLAGS="window:0"
        [ "${OPENMP}" = "0" ] && AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,openmp:1" || AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,openmp:0"
        [ "${PRECISION_OPT}" = "" ] && AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,precision:1" || AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,precision:0"
        ./configure --with-window=${WINDOW} ${PRECISION_OPT} --enable-all --enable-exhaustive-unit-tests \
        $(if [ "${OPENMP}" = "1" ]; then echo "--enable-openmp"; else echo ""; fi) \
        $(if [ "${BUILD_OCTAVE}" = "1" ]; then echo "--with-octave=$OCTAVEDIR"; else echo ""; fi) \
        $(if [ "${BUILD_JULIA}" = "1" ] && [ "${PRECISION_OPT}" = "" ]; then echo "--enable-julia"; else echo ""; fi)
      # --enable-benchmarks --with-benchmarks-prefix=${BUILD_CONFIG}/ --with-codspeed=$(pwd)/codspeed-cpp \
      # --with-agnostic-benchmarks="$AGNOSTIC_FLAGS" \

    - name: Build
      run: make
    
    - name: Test
      id: test
      run: make check

    - name: Run tests again to reproduce failure
      if: steps.test.outcome == 'failure'
      shell: bash
      env:
        OPENMP: ${{ matrix.openmp }}
      run: |
        tests/checkall > checkall.log
        if [ "${OPENMP}" = "1" ]; then tests/checkall_threads > checkall_threads.log; fi

    - name: Upload test failure logs
      if: steps.test.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-failure-logs-${BUILD_CONFIG}
        path: |
          checkall.log
          checkall_threads.log
        if-no-files-found: ignore

    - name: Convert CUnit test reports to JUnit
      if: always()
      run: |
        conv() { uv run --with lxml python -c "import sys;from lxml import etree;d=etree.parse(sys.argv[1]);open(sys.argv[3],'wb').write(etree.tostring(etree.XSLT(etree.parse(sys.argv[2]))(d),pretty_print=True))" "$1" tests/cunit2junit.xsl "$2"; }
        [ -f tests/CUnitAutomated-Results.xml ]         && conv tests/CUnitAutomated-Results.xml         tests/junit.xml         || true
        [ -f tests/CUnitAutomated_threads-Results.xml ] && conv tests/CUnitAutomated_threads-Results.xml tests/junit_threads.xml || true

    - name: CMake — clear stale in-source config.h
      shell: bash
      run: |
        if [ -f include/config.h ]; then mv include/config.h include/config.h.autotools.bak; fi

    - name: CMake — configure (no benchmark, OpenMP off, Homebrew FFTW)
      shell: bash
      env:
        PRECISION_OPT: ${{ matrix.precision_opt }}
        BUILD_JULIA: ${{ matrix.build_julia }}
      run: |
        case "${PRECISION_OPT}" in
          "")                     CMAKE_PREC="" ;;
          "--enable-float")       CMAKE_PREC="-DNFFT_ENABLE_FLOAT=ON" ;;
          "--enable-long-double") CMAKE_PREC="-DNFFT_ENABLE_LONG_DOUBLE=ON" ;;
          *) echo "Unknown PRECISION_OPT '${PRECISION_OPT}'" >&2; exit 1 ;;
        esac
        # Julia interface is double-only — mirror the Autotools --enable-julia gating.
        CMAKE_JULIA=""
        if [ "${BUILD_JULIA}" = "1" ] && [ -z "${PRECISION_OPT}" ]; then
          CMAKE_JULIA="-DNFFT_ENABLE_JULIA=ON"
        fi
        cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DNFFT_WINDOW=kaiserbessel ${CMAKE_PREC} ${CMAKE_JULIA} \
          -DNFFT_ENABLE_OPENMP=OFF \
          -DNFFT_ENABLE_EXHAUSTIVE_UNIT_TESTS=ON \
          -DNFFT_ENABLE_EXAMPLES=ON -DNFFT_ENABLE_APPLICATIONS=ON \
          -DFFTW3_ROOT=/opt/homebrew
        # CC/CXX from the "Set up compiler" step are honored by CMake automatically.

    - name: CMake — build
      run: cmake --build build-cmake -j

    - name: CMake — assert example/application binaries built
      shell: bash
      run: |
        set -e
        # Always-precision representatives (present in every cell):
        for b in examples/nfft/simple_test examples/solver/glacier \
                 applications/fastgauss/fastgauss applications/fastsum/fastsum_test \
                 applications/radon/radon; do
          test -x "build-cmake/$b" || { echo "MISSING: build-cmake/$b" >&2; exit 1; }
        done
        # Double-only representatives only in the double cells (precision_opt empty):
        if [ -z "${{ matrix.precision_opt }}" ]; then
          for b in examples/nfsft/simple_test applications/quadratureS2/quadratureS2 \
                   applications/mri/mri2d/construct_data_2d; do
            test -x "build-cmake/$b" || { echo "MISSING (double): build-cmake/$b" >&2; exit 1; }
          done
        fi
        echo "example/application binaries present"

    - name: CMake — ctest (CUnit suite)
      shell: bash
      run: |
        set -o pipefail
        ctest --test-dir build-cmake --output-on-failure 2>&1 | tee build-cmake/ctest.log

    - name: CMake — convert CUnit reports to JUnit
      if: always()
      shell: bash
      run: |
        conv() { uv run --with lxml python -c "import sys;from lxml import etree;d=etree.parse(sys.argv[1]);open(sys.argv[3],'wb').write(etree.tostring(etree.XSLT(etree.parse(sys.argv[2]))(d),pretty_print=True))" "$1" tests/cunit2junit.xsl "$2"; }
        [ -f build-cmake/tests/CUnitAutomated-Results.xml ]         && conv build-cmake/tests/CUnitAutomated-Results.xml         build-cmake/tests/junit.xml         || true
        [ -f build-cmake/tests/CUnitAutomated_threads-Results.xml ] && conv build-cmake/tests/CUnitAutomated_threads-Results.xml build-cmake/tests/junit_threads.xml || true

    - name: CMake — Publish Test Report (serial)
      if: ${{ always() && hashFiles('build-cmake/tests/junit.xml') != '' }}
      uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1
      with:
        report-path: './build-cmake/tests/junit.xml'
        integrations-config: |
          {
            "junit-to-ctrf": {
              "enabled": true, "action": "convert",
              "options": {
                "output": "./ctrf-reports/ctrf-cmake.json",
                "toolname": "junit-to-ctrf", "useSuiteName": false,
                "env": { "appName": "nfft-cmake" }
              }
            }
          }

    - name: CMake — test install
      shell: bash
      run: |
        cmake --install build-cmake --prefix "${{ github.workspace }}/_install_cmake"
        test -f "${{ github.workspace }}/_install_cmake/include/nfft3.h"
        SUFFIX=$([ "${{ matrix.precision_opt }}" = "--enable-float" ] && echo f || \
                 { [ "${{ matrix.precision_opt }}" = "--enable-long-double" ] && echo l || echo ""; })
        ls "${{ github.workspace }}"/_install_cmake/lib*/cmake/nfft3${SUFFIX}/NFFT3${SUFFIX}Config.cmake

    - name: CMake — run-verify Julia staged simple_tests
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      shell: bash
      run: |
        set -e
        ls build-cmake/julia/nfft/libnfftjulia.*
        echo "macOS CMake julia interface artifact present"
        for DIR in build-cmake/julia/*/; do
          for NAME in "$DIR"simple_test*.jl; do
            [ -e "$NAME" ] || continue
            echo "== julia $NAME =="
            ( cd "$DIR" && julia "$(basename "$NAME")" )
          done
        done

    - name: Test Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      run: |
        for DIR in julia/nf*t julia/fastsum; do
          cd $DIR
          for NAME in simple_test*.jl; do
            julia "$NAME"
          done
          cd ../..
        done
    
    - name: Test Octave
      if: matrix.build_octave == '1'
      run: |
        for DIR in matlab/nf*t matlab/fastsum; do
          cd $DIR
          for NAME in simple_test*.m; do
            $OCTAVE --eval="run('$NAME')"
          done
          cd ../..
        done

    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1
      with:
        report-path: './tests/junit.xml'
        integrations-config: |
          {
            "junit-to-ctrf": {
              "enabled": true,
              "action": "convert",
              "options": {
                "output": "./ctrf-reports/ctrf-report.json",
                "toolname": "junit-to-ctrf",
                "useSuiteName": false,
                "env": {
                  "appName": "nfft"
                }
              }
            }
          }
      if: ${{ always() && hashFiles('tests/junit.xml') != '' }}

    - name: Publish Test Report (threads)
      if: ${{ always() && hashFiles('tests/junit_threads.xml') != '' }}
      uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1
      with:
        report-path: './tests/junit_threads.xml'
        integrations-config: |
          {
            "junit-to-ctrf": {
              "enabled": true, "action": "convert",
              "options": {
                "output": "./ctrf-reports/ctrf-threads.json",
                "toolname": "junit-to-ctrf", "useSuiteName": false,
                "env": { "appName": "nfft-threads" }
              }
            }
          }

  distcheck:
    runs-on: macos-26
    name: "distcheck"
    env:
      CPPFLAGS: "-I/opt/homebrew/include"
      LDFLAGS: "-L/opt/homebrew/lib"
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        persist-credentials: false

    - uses: gerlero/brew-install@b7bdd6875207fdf3b7ebd0ecc5cf8da6e657eca2 # v1
      with:
        cache: true
        packages: |
          autoconf
          automake
          libtool
          cmake
          fftw

    - name: Bootstrap
      run: ./bootstrap.sh
    
    - name: Configure
      run: ./configure --enable-all
    
    - name: Distcheck
      run: make distcheck
