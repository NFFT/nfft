name: Probe KB reach 80-bit

on:
  push:
    branches: [ 'probe/**' ]

permissions:
  contents: read

jobs:
  tests:
    name: "long-double-${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: develop
            ref: bf405a21459a4987c94fda4f0c116eae53ce8895
          - name: phase
            ref: 28b48a10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          path: src
      - name: Check out ref under test
        run: cd src && git checkout --detach "${{ matrix.ref }}" && git log --oneline -1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libcunit1-dev autoconf automake libtool
      - name: Build
        run: |
          cd src
          ./bootstrap.sh
          ./configure --with-window=kaiserbessel --enable-long-double --enable-all \
            --enable-openmp --enable-tests --enable-exhaustive-unit-tests
          make -j"$(nproc)"
      - name: Test
        run: |
          cd src
          set +e
          make check
          echo $? > tests/check.rc
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.name }}
          path: |
            src/tests/checkall.log
            src/tests/checkall_threads.log
            src/tests/check.rc

  report:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: art
      - name: Compare margins
        run: |
          notice() { printf '::notice title=%s::%s\n' "$1" "$(sed 's/%/%25/g' "$2" | awk '{printf "%s%%0A", $0}')"; }
          for n in develop phase; do
            printf '%s rc=%s FAIL=%s OK=%s\n' $n "$(cat art/tests-$n/check.rc)" \
              "$(grep -c FAIL art/tests-$n/checkall.log)" "$(grep -c -- '-> OK' art/tests-$n/checkall.log)"
          done | tee status.txt
          notice status status.txt
          grep -h -- '-> FAIL' art/tests-*/checkall.log | cut -c1-200 | head -40 > fails.txt || true
          if [ -s fails.txt ]; then notice fails fails.txt; fi
      - name: Compare develop and phase fix
        run: |
          notice() { printf '::notice title=%s::%s\n' "$1" "$(sed 's/%/%25/g' "$2" | awk '{printf "%s%%0A", $0}')"; }
          for mod in nfct nfft nfst; do
            python3 src/probe/cmp.py art/tests-develop/checkall.log art/tests-phase/checkall.log $mod | tee phase-$mod.txt
            notice "develop-vs-phase-$mod" phase-$mod.txt
          done
