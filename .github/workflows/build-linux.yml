name: Build Linux

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      BUILD_CONFIG: "${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.window }}_${{ matrix.precision_opt == '' && 'double' || matrix.precision_opt == '--enable-float' && 'float' || matrix.precision_opt == '--enable-long-double' && 'long-double' || 'unknown' }}"
    name: "${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.window }}-${{ matrix.precision_opt == '' && 'double' || matrix.precision_opt == '--enable-float' && 'float' || matrix.precision_opt == '--enable-long-double' && 'long-double' || 'unknown' }}"
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        compiler: ["gcc"]
        window: ["kaiserbessel", "gaussian", "bspline", "sinc"]
        precision_opt: ["", "--enable-float", "--enable-long-double"]
        build_octave: [0] # TODO: Re-activate Octave build and tests.
        build_julia: [1]
        include:
          # Clang
          - os: "ubuntu-latest"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: ""
            build_octave: 0
            build_julia: 1
          - os: "ubuntu-latest"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: "--enable-float"
            build_octave: 0
            build_julia: 1
          - os: "ubuntu-latest"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: "--enable-long-double"
            build_octave: 0
            build_julia: 1
          # GCC 14
          - os: "ubuntu-latest"
            compiler: "gcc-14"
            window: "kaiserbessel"
            precision_opt: ""
            build_octave: 0
            build_julia: 1
          # GCC Snapshot
          - os: "ubuntu-latest"
            compiler: "gcc-snapshot"
            window: "kaiserbessel"
            precision_opt: ""
            build_octave: 0
            build_julia: 1
    steps:    
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update        
    
    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          software-properties-common

    - name: Add universe repo
      run: sudo add-apt-repository universe

    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          build-essential
          gcc-snapshot
          gcc-14
          g++-14
          cmake
          libfftw3-dev
          libcunit1-dev 
          doxygen 
          doxygen-latex 
          graphviz
          octave-dev
          clang
          libomp-dev
          libatomic1

    - name: Set up Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v2
      with:
        version: '1'
        show-versioninfo: false

    - name: Set up uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Set up Octave
      if: matrix.build_octave == '1'
      run: |
        echo "OCTAVEDIR=/usr" >> $GITHUB_ENV
        echo "OCTAVE=octave" >> $GITHUB_ENV
      
    - name: Set up compiler
      shell: bash
      env:
        COMPILER: "${{ matrix.compiler }}"
      run: |
        if [ "${COMPILER}" = "clang" ]; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        elif [ "${COMPILER}" = "gcc" ]; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        elif [ "${COMPILER}" = "gcc-snapshot" ]; then
          echo "CC=/usr/lib/gcc-snapshot/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/usr/lib/gcc-snapshot/bin/g++" >> $GITHUB_ENV
        elif echo "${COMPILER}" | grep -qE '^gcc-[0-9]+$'; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          GCC_VERSION=$(echo "${COMPILER}" | sed 's/gcc-//')
          echo "CXX=g++-${GCC_VERSION}" >> $GITHUB_ENV
        else
          echo "Error: Unknown compiler '${COMPILER}'. Supported compilers are: gcc, clang, gcc-snapshot, gcc-<version>" >&2
          exit 1
        fi
        
    - name: Autotools - Bootstrap
      run: ./bootstrap.sh
    
    - name: Autotools - Configure
      shell: bash
      env:
        WINDOW: ${{ matrix.window }}
        PRECISION_OPT: ${{ matrix.precision_opt }}
        BUILD_OCTAVE: ${{ matrix.build_octave }}
        BUILD_JULIA: ${{ matrix.build_julia }}
        COMPILER: ${{ matrix.compiler }}
      run: |
        ./configure --with-window=${WINDOW} ${PRECISION_OPT} --enable-all --enable-openmp \
        $(if [ "${COMPILER}" = "gcc" ]; then echo "--enable-tests  --enable-exhaustive-unit-tests"; fi) \
        $(if [ "${BUILD_OCTAVE}" = "1" ]; then echo "--with-octave=$OCTAVEDIR"; else echo ""; fi) \
        $(if [ "${BUILD_JULIA}" = "1" ] && [ "${PRECISION_OPT}" = "" ]; then echo "--enable-julia"; else echo ""; fi)
    
    - name: Autotools - Build
      run: make -j
    
    - name: Autotools - Test
      id: test
      if: matrix.compiler == 'gcc'
      # NFFT_BENCH_OUT makes the existing `make check` run also emit per-case
      # accuracy NDJSON (serial -> *.ndjson, OpenMP -> *.ndjson.threads). No-op
      # without this var, so other cells/builds are unaffected. See
      # docs/agents/accuracy-tracking.md.
      env:
        NFFT_BENCH_OUT: ${{ github.workspace }}/tests/accuracy.ndjson
      run: make check

    - name: Autotools - Print checkall.log on test failure
      if: failure() && steps.test.conclusion == 'failure'
      shell: bash
      run: |
        echo "=========================================="
        echo "Contents of checkall.log:"
        echo "=========================================="
        if [ -f tests/checkall.log ]; then
          cat tests/checkall.log
        else
          echo "checkall.log not found"
        fi
        echo ""
        echo "=========================================="
        echo "Contents of checkall_threads.log:"
        echo "=========================================="
        if [ -f tests/checkall_threads.log ]; then
          cat tests/checkall_threads.log
        else
          echo "checkall_threads.log not found"
        fi

    - name: Autotools - Run tests again to reproduce failure
      if: failure() && steps.test.conclusion == 'failure'
      shell: bash
      run: |
        tests/checkall > checkall.log
        tests/checkall_threads > checkall_threads.log

    - name: Autotools - Upload test failure logs
      if: failure() && steps.test.conclusion == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-failure-logs-${BUILD_CONFIG}
        path: |
          checkall.log
          checkall_threads.log
        if-no-files-found: ignore

    - name: Autotools - Convert CUnit test reports to JUnit
      if: always()
      run: |
        conv() { uv run --with lxml python -c "import sys;from lxml import etree;d=etree.parse(sys.argv[1]);open(sys.argv[3],'wb').write(etree.tostring(etree.XSLT(etree.parse(sys.argv[2]))(d),pretty_print=True))" "$1" tests/cunit2junit.xsl "$2"; }
        [ -f tests/CUnitAutomated-Results.xml ]         && conv tests/CUnitAutomated-Results.xml         tests/junit.xml         || true
        [ -f tests/CUnitAutomated_threads-Results.xml ] && conv tests/CUnitAutomated_threads-Results.xml tests/junit_threads.xml || true

    - name: Autotools - Publish Test Report (serial)
      if: ${{ always() && hashFiles('tests/junit.xml') != '' }}
      uses: ctrf-io/github-test-reporter@0f299074936c32ccaab5be5230511f6b2b9080aa # v1
      with:
        report-path: './tests/junit.xml'
        integrations-config: |
          {
            "junit-to-ctrf": {
              "enabled": true,
              "action": "convert",
              "options": {
                "output": "./ctrf-reports/ctrf-report.json",
                "toolname": "junit-to-ctrf",
                "useSuiteName": false,
                "env": {
                  "appName": "nfft"
                }
              }
            }
          }

    - name: Autotools - Publish Test Report (threads)
      if: ${{ always() && hashFiles('tests/junit_threads.xml') != '' }}
      uses: ctrf-io/github-test-reporter@0f299074936c32ccaab5be5230511f6b2b9080aa # v1
      with:
        report-path: './tests/junit_threads.xml'
        integrations-config: |
          {
            "junit-to-ctrf": {
              "enabled": true, "action": "convert",
              "options": {
                "output": "./ctrf-reports/ctrf-threads.json",
                "toolname": "junit-to-ctrf", "useSuiteName": false,
                "env": { "appName": "nfft-threads" }
              }
            }
          }

    # Accuracy tracking: aggregate the NDJSON `make check` just emitted into a
    # Bencher BMF file and publish it as an artifact. No secret is used here, so
    # this runs on every push/PR (forks included); the gated upload to Bencher
    # is the separate `bencher-upload` job. gcc cells only (they run the tests).
    - name: Accuracy - aggregate NDJSON to BMF
      if: matrix.compiler == 'gcc'
      shell: bash
      run: |
        : > tests/accuracy.all.ndjson
        for f in tests/accuracy.ndjson tests/accuracy.ndjson.threads; do
          [ -f "$f" ] && cat "$f" >> tests/accuracy.all.ndjson
        done
        test -s tests/accuracy.all.ndjson
        uv run python tests/bench/ndjson_to_bmf.py \
          tests/accuracy.all.ndjson tests/accuracy.bmf.json

    - name: Accuracy - upload BMF artifact
      if: matrix.compiler == 'gcc'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: accuracy-bmf-${{ env.BUILD_CONFIG }}
        path: tests/accuracy.bmf.json
        if-no-files-found: error

    - name: Autotools - Test Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      run: |
        for DIR in julia/nf*t julia/fastsum; do
          cd $DIR
          for NAME in simple_test*.jl; do
            julia -q "$NAME"
          done
          cd ../..
        done

    - name: Autotools - Test Octave
      if: matrix.build_octave == '1'
      run: |
        for DIR in matlab/nf*t matlab/fastsum; do
          cd $DIR
          for NAME in simple_test*.m; do
            $OCTAVE --eval="run('$NAME')"
          done
          cd ../..
        done

    # CMake build starts here.
    - name: CMake — Clear stale in-source config.h
      shell: bash
      run: |
        if [ -f include/config.h ]; then mv include/config.h include/config.h.autotools.bak; fi

    - name: CMake — Configure (all windows; benchmark only in gcc kaiserbessel)
      shell: bash
      env:
        WINDOW: ${{ matrix.window }}
        PRECISION_OPT: ${{ matrix.precision_opt }}
        BUILD_JULIA: ${{ matrix.build_julia }}
        COMPILER: ${{ matrix.compiler }}
      run: |
        case "${PRECISION_OPT}" in
          "")                     CMAKE_PREC="" ;;
          "--enable-float")       CMAKE_PREC="-DNFFT_ENABLE_FLOAT=ON" ;;
          "--enable-long-double") CMAKE_PREC="-DNFFT_ENABLE_LONG_DOUBLE=ON" ;;
          *) echo "Unknown PRECISION_OPT '${PRECISION_OPT}'" >&2; exit 1 ;;
        esac
        # Julia interface is double-only.
        CMAKE_JULIA=""
        if [ "${BUILD_JULIA}" = "1" ] && [ -z "${PRECISION_OPT}" ]; then
          CMAKE_JULIA="-DNFFT_ENABLE_JULIA=ON"
        fi
        cmake -S . -B build-cmake \
          -DCMAKE_C_FLAGS="-O3 -g -fomit-frame-pointer -fstrict-aliasing -ffast-math" \
          -DNFFT_WINDOW="${WINDOW}" ${CMAKE_PREC} -DNFFT_ENABLE_OPENMP=ON ${CMAKE_JULIA} \
          -DNFFT_ENABLE_EXHAUSTIVE_UNIT_TESTS=ON \
          -DNFFT_ENABLE_EXAMPLES=ON -DNFFT_ENABLE_APPLICATIONS=ON \
          -DNFFT_ENABLE_TESTS=ON

    - name: CMake — Check config.h parity (Autotools vs. CMake)
      shell: bash
      run: bash cmake/config-parity-check.sh include/config.h.autotools.bak build-cmake/config.h include/config.h.in

    - name: CMake — Build
      run: cmake --build build-cmake -j

    - name: CMake — Assert example/application
      shell: bash
      run: |
        set -e
        # Always-precision representatives (present in every cell):
        for b in examples/nfft/simple_test examples/solver/glacier \
                 applications/fastgauss/fastgauss applications/fastsum/fastsum_test \
                 applications/radon/radon; do
          test -x "build-cmake/$b" || { echo "MISSING: build-cmake/$b" >&2; exit 1; }
        done
        # Double-only representatives only in the double cells (precision_opt empty):
        if [ -z "${{ matrix.precision_opt }}" ]; then
          for b in examples/nfsft/simple_test applications/quadratureS2/quadratureS2 \
                   applications/mri/mri2d/construct_data_2d; do
            test -x "build-cmake/$b" || { echo "MISSING (double): build-cmake/$b" >&2; exit 1; }
          done
        fi
        echo "example/application binaries present"

    - name: CMake — Install
      if: matrix.window == 'kaiserbessel'
      shell: bash
      run: |
        cmake --install build-cmake --prefix "${{ github.workspace }}/_install_cmake"
        test -f "${{ github.workspace }}/_install_cmake/include/nfft3.h"
        SUFFIX=$([ "${{ matrix.precision_opt }}" = "--enable-float" ] && echo f || \
                 { [ "${{ matrix.precision_opt }}" = "--enable-long-double" ] && echo l || echo ""; })
        ls "${{ github.workspace }}"/_install_cmake/lib*/cmake/nfft3${SUFFIX}/NFFT3${SUFFIX}Config.cmake

    - name: CMake — Test Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      shell: bash
      run: |
        set -e
        ls build-cmake/julia/nfft/libnfftjulia.*
        echo "CMake julia interface artifact present"
        for DIR in build-cmake/julia/*/; do
          for NAME in "$DIR"simple_test*.jl; do
            [ -e "$NAME" ] || continue
            echo "== julia $NAME =="
            ( cd "$DIR" && julia "$(basename "$NAME")" )
          done
        done

  # Gated upload of the accuracy BMF artifacts to Bencher (track-only). The test
  # run and BMF production happen in `build` with no secret; ONLY this upload is
  # gated. No `--err`/thresholds -> never fails CI.
  #
  # ONLY fork PRs are gated (the only untrusted upload source); everything else
  # runs unattended. The key is held as *environment* secrets (not repo-wide) so
  # only this job can read it, and only after the environment's rules pass:
  #   - fork pull_request -> `benchmarks`       (required reviewer -> approval)
  #   - everything else   -> `bencher-baseline` (no reviewer -> unattended:
  #     (push to default branches,               trusted same-repo PRs, default-
  #      same-repo PR, workflow_dispatch)        branch pushes, manual dispatch)
  # Both environments must hold the BENCHER_API_TOKEN secret. `bencher-baseline`
  # must ALLOW ALL BRANCHES (its deployment-branch policy) -- otherwise same-repo
  # PR feature branches would be blocked from it. The fork/non-fork split is the
  # real trust boundary, so the branch restriction is not needed for safety.
  bencher-upload:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'benchmarks' || 'bencher-baseline' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0   # start-point-hash needs base-branch history

      - name: Set up Bencher CLI
        uses: bencherdev/bencher@5f9d4cf890255c35e0354af1ed325108a6a0babd # v0.6.8

      - name: Download accuracy BMF artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: accuracy-bmf-*
          path: bmf-artifacts

      - name: Upload to Bencher (track-only)
        shell: bash
        # Expose the secret as BENCHER_API_KEY (NOT BENCHER_API_TOKEN): the value
        # is a project-scoped `bencher_run_*` key, and `bencher run`'s deprecated
        # `--token` reads the BENCHER_API_TOKEN env var and validates it as a JWT.
        # Setting that var would make `--token` reject the (non-JWT) key, failing
        # the upload at arg-parse time even though we pass `--key`. The GitHub
        # secret keeps the name BENCHER_API_TOKEN (no rename needed on GitHub).
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          dirs=(bmf-artifacts/accuracy-bmf-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No accuracy BMF artifacts found; nothing to upload."
            exit 0
          fi
          for d in "${dirs[@]}"; do
            testbed="$(basename "$d")"; testbed="${testbed#accuracy-bmf-}"
            file="${d}accuracy.bmf.json"
            [ -f "$file" ] || { echo "skip ${testbed}: no BMF file"; continue; }
            # Track-only: no --err and no thresholds, so nothing ever fails CI.
            # Fork PRs without the key fall back to --dry-run.
            ARGS=()
            [ -z "${BENCHER_API_KEY}" ] && ARGS+=(--dry-run)
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              ARGS+=(--branch "${GITHUB_HEAD_REF}"
                     --start-point "${GITHUB_BASE_REF}"
                     --start-point-hash "$(git rev-parse "origin/${GITHUB_BASE_REF}")"
                     --start-point-reset)
            else
              ARGS+=(--branch "${GITHUB_REF_NAME}")
            fi
            echo "== uploading testbed ${testbed} =="
            bencher run \
              "${ARGS[@]}" \
              --project nfft \
              --key "${BENCHER_API_KEY}" \
              --testbed "${testbed}" \
              --adapter json \
              --file "${file}"
          done

  accuracy-report:
    needs: build
    runs-on: ubuntu-latest
    # Uses only GITHUB_TOKEN (no secret) -> no environment gating needed. Skipped
    # for FORK PRs: GitHub forces a read-only token on fork pull_request runs, so
    # the gh-pages push and the Check/comment POSTs cannot succeed there. Runs for
    # pushes to default branches, same-repo PRs, and workflow_dispatch.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: write          # push to gh-pages
      checks: write            # post the Check
      pull-requests: write      # upsert the comment
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false   # gh-pages-publish.sh authenticates via its own clone URL
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7
        with:
          enable-cache: true

      - name: Download accuracy BMF artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: accuracy-bmf-*
          path: bmf-artifacts

      - name: Arrange BMFs as <testbed>.bmf.json
        shell: bash
        run: |
          mkdir -p pr-bmf
          shopt -s nullglob
          for d in bmf-artifacts/accuracy-bmf-*/; do
            tb="$(basename "$d")"; tb="${tb#accuracy-bmf-}"
            [ -f "${d}accuracy.bmf.json" ] && cp "${d}accuracy.bmf.json" "pr-bmf/${tb}.bmf.json"
          done
          ls pr-bmf

      - name: Develop — publish dashboard + baseline to gh-pages
        # Only the develop baseline is published; main/master pushes must not clobber it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        continue-on-error: true   # informational: a publish failure must never red CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --with matplotlib python tests/bench/dashboard.py pr-bmf site
          bash .github/scripts/gh-pages-publish.sh site "develop dashboard ${GITHUB_SHA::7}"

      - name: PR — fetch baseline, diff, post Check + comment
        if: github.event_name == 'pull_request'
        continue-on-error: true   # informational: a report/post failure must never red CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/accuracy-pr-report.sh

  distcheck:
    runs-on: ubuntu-latest
    name: "distcheck"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update        

    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          build-essential
          cmake
          libfftw3-dev
          libcunit1-dev 
          doxygen 
          doxygen-latex 
          graphviz

    - name: Bootstrap
      run: ./bootstrap.sh
    
    - name: Configure
      run: ./configure --enable-all --enable-exhaustive-unit-tests
    
    - name: Distcheck
      run: make distcheck

  # Standalone run-once Octave-interface smoke. Deliberately NOT folded into the
  # build matrix: NFFT_WITH_OCTAVE FATAL_ERRORs on long-double, and the Octave
  # ctest suite is ~6.5 min/cell — folding would be costly and break the
  # long-double cells. (The CMake Julia interface IS folded into the build matrix,
  # gated on double precision, mirroring the Autotools --enable-julia path.)
  cmake-octave:
    runs-on: ubuntu-24.04
    name: "cmake-octave"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ \
            libfftw3-dev libfftw3-double3 libcunit1-dev octave-dev libomp-dev

      - name: Configure (Octave interface, double, OpenMP)
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNFFT_WITH_OCTAVE=ON \
            -DNFFT_ENABLE_OPENMP=ON \
            -DNFFT_ENABLE_EXAMPLES=OFF -DNFFT_ENABLE_APPLICATIONS=OFF \
            -DNFFT_ENABLE_TESTS=ON

      - name: Build interface
        run: cmake --build build-cmake -j

      - name: Assert interface artifact built
        run: |
          set -e
          test -f build-cmake/matlab/nfft/nfftmex.mex
          echo "octave interface artifact present"

      - name: Run-verify Octave interface tests (ctest -L octave)
        run: |
          set -o pipefail
          ctest --test-dir build-cmake -L octave --output-on-failure 2>&1 \
            | tee build-cmake/ctest-octave.log
