name: Build Linux

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux
  cancel-in-progress: false

env:
  CODSPEED_VERSION: v1.3.0

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      BUILD_CONFIG: "${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.window }}_${{ matrix.precision_opt == '' && 'double' || matrix.precision_opt == '--enable-float' && 'float' || matrix.precision_opt == '--enable-long-double' && 'long-double' || 'unknown' }}_${{ matrix.openmp == 1 && 'openmp' || 'singlethread' }}"
    name: "${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.window }}-${{ matrix.precision_opt == '' && 'double' || matrix.precision_opt == '--enable-float' && 'float' || matrix.precision_opt == '--enable-long-double' && 'long-double' || 'unknown' }}-${{ matrix.openmp == 1 && 'openmp' || 'singlethread' }}"
    strategy:
      matrix:
        os: ["ubuntu-latest"] # TODO: Add more Ubuntu versions, e.g. "ubuntu-20.04", "ubuntu-18.04".
        compiler: ["gcc"]
        window: ["kaiserbessel", "gaussian", "bspline", "sinc"] # TODO: Add dirac.
        precision_opt: ["", "--enable-float", "--enable-long-double"]
        openmp: [0, 1]
        build_octave: [0] # TODO: Re-activate Octave build and tests.
        build_julia: [1]
        include:
          # Clang
          - os: "ubuntu-latest"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 1
            build_octave: 0
            build_julia: 1
          - os: "ubuntu-latest"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: "--enable-float"
            openmp: 1
            build_octave: 0
            build_julia: 1
          - os: "ubuntu-latest"
            compiler: "clang"
            window: "kaiserbessel"
            precision_opt: "--enable-long-double"
            openmp: 1
            build_octave: 0
            build_julia: 1
          # GCC 14
          - os: "ubuntu-latest"
            compiler: "gcc-14"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 1
            build_octave: 0
            build_julia: 1
          # GCC Snapshot
          - os: "ubuntu-latest"
            compiler: "gcc-snapshot"
            window: "kaiserbessel"
            precision_opt: ""
            openmp: 1
            build_octave: 0
            build_julia: 1
    steps:    
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false
    - name: Enable core dumps
      run: |
        ulimit -c unlimited
        sudo mkdir /cores
        sudo chmod 777 /cores
        # Core filenames will be of the form executable.pid.timestamp:
        sudo bash -c 'echo "/cores/%e.%p.%t" > /proc/sys/kernel/core_pattern'
        echo "Core dumps will be written to: /cores"

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update        
    
    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          software-properties-common

    - name: Add universe repo
      run: sudo add-apt-repository universe

    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          build-essential
          gcc-snapshot
          gcc-14
          g++-14
          cmake
          libfftw3-dev
          libcunit1-dev 
          doxygen 
          doxygen-latex 
          graphviz
          octave-dev
          clang
          libomp-dev
          libatomic1

    - name: Set up Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      uses: julia-actions/setup-julia@f6f565d9f7cf12f53dc8045742460d6260ad3b39 # v2
      with:
        version: '1'
        show-versioninfo: false

    - name: Set up uv
      uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Cache CodSpeed integration library
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: cache-codspeed
      with:
        path: codspeed-cpp
        key: codspeed-cpp-${{ matrix.os }}-${{ env.CODSPEED_VERSION }}

    - name: Checkout CodSpeed integration library
      if: steps.cache-codspeed.outputs.cache-hit != 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false
        repository: CodSpeedHQ/codspeed-cpp
        ref: "${{ env.CODSPEED_VERSION }}"
        path: codspeed-cpp
        submodules: recursive

    - name: Configure CMake for CodSpeed integration library
      if: steps.cache-codspeed.outputs.cache-hit != 'true'
      run: |
        cd codspeed-cpp/google_benchmark
        cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON -DCODSPEED_MODE=instrumentation -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_EXTENSIONS=OFF.

    - name: Build CodSpeed integration library
      if: steps.cache-codspeed.outputs.cache-hit != 'true'
      run: |
        cd codspeed-cpp/google_benchmark
        cmake --build . -v
    
    - name: Set up Octave
      if: matrix.build_octave == '1'
      run: |
        echo "OCTAVEDIR=/usr" >> $GITHUB_ENV
        echo "OCTAVE=octave" >> $GITHUB_ENV
      
    - name: Set up compiler
      shell: bash
      env:
        COMPILER: "${{ matrix.compiler }}"
      run: |
        if [ "${COMPILER}" = "clang" ]; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        elif [ "${COMPILER}" = "gcc" ]; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        elif [ "${COMPILER}" = "gcc-snapshot" ]; then
          echo "CC=/usr/lib/gcc-snapshot/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/usr/lib/gcc-snapshot/bin/g++" >> $GITHUB_ENV
        elif echo "${COMPILER}" | grep -qE '^gcc-[0-9]+$'; then
          echo "CC=${COMPILER}" >> $GITHUB_ENV
          GCC_VERSION=$(echo "${COMPILER}" | sed 's/gcc-//')
          echo "CXX=g++-${GCC_VERSION}" >> $GITHUB_ENV
        else
          echo "Error: Unknown compiler '${COMPILER}'. Supported compilers are: gcc, clang, gcc-snapshot, gcc-<version>" >&2
          exit 1
        fi
        
    - name: Bootstrap
      run: ./bootstrap.sh
    
    - name: Configure
      shell: bash
      env:
        WINDOW: ${{ matrix.window }}
        OPENMP: ${{ matrix.openmp }}
        PRECISION_OPT: ${{ matrix.precision_opt }}
        BUILD_OCTAVE: ${{ matrix.build_octave }}
        BUILD_JULIA: ${{ matrix.build_julia }}
      run: |
        AGNOSTIC_FLAGS=""
        [ "${WINDOW}" = "kaiserbessel" ] && AGNOSTIC_FLAGS="window:1" || AGNOSTIC_FLAGS="window:0"
        [ "${OPENMP}" = "0" ] && AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,openmp:1" || AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,openmp:0"
        [ "${PRECISION_OPT}" = "" ] && AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,precision:1" || AGNOSTIC_FLAGS="$AGNOSTIC_FLAGS,precision:0"
        ./configure --with-window=${WINDOW} ${PRECISION_OPT} --enable-all --enable-exhaustive-unit-tests \
        --enable-benchmarks --with-benchmarks-prefix=${BUILD_CONFIG}/ --with-codspeed=$(pwd)/codspeed-cpp \
        --with-agnostic-benchmarks="$AGNOSTIC_FLAGS" \
        $(if [ "${OPENMP}" = "1" ]; then echo "--enable-openmp"; else echo ""; fi) \
        $(if [ "${BUILD_OCTAVE}" = "1" ]; then echo "--with-octave=$OCTAVEDIR"; else echo ""; fi) \
        $(if [ "${BUILD_JULIA}" = "1" ] && [ "${PRECISION_OPT}" = "" ]; then echo "--enable-julia"; else echo ""; fi)
    
    - name: Build
      run: make -j
    
    - name: Test
      id: test
      run: make check

    - name: Print checkall.log on test failure
      if: failure() && steps.test.conclusion == 'failure'
      shell: bash
      run: |
        echo "=========================================="
        echo "Contents of checkall.log:"
        echo "=========================================="
        if [ -f tests/checkall.log ]; then
          cat tests/checkall.log
        else
          echo "checkall.log not found"
        fi
        echo ""
        echo "=========================================="
        echo "Contents of checkall_threads.log:"
        echo "=========================================="
        if [ -f tests/checkall_threads.log ]; then
          cat tests/checkall_threads.log
        else
          echo "checkall_threads.log not found"
        fi

    - name: Run tests again to reproduce failure
      if: failure() && steps.test.conclusion == 'failure'
      shell: bash
      env:
        OPENMP: ${{ matrix.openmp }}
      run: |
        tests/checkall > checkall.log
        if [ "${OPENMP}" = "1" ]; then tests/checkall_threads > checkall_threads.log; fi

    - name: Upload test failure logs
      if: failure() && steps.test.conclusion == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-failure-logs-${BUILD_CONFIG}
        path: |
          checkall.log
          checkall_threads.log
        if-no-files-found: ignore

    - name: Convert CUnit test report to JUnit
      run: |
        uv run --with lxml python -c "from lxml import etree; doc = etree.parse('tests/CUnitAutomated-Results.xml'); xslt = etree.XSLT(etree.parse('tests/cunit2junit.xsl')); result = xslt(doc); open('tests/junit.xml', 'wb').write(etree.tostring(result, pretty_print=True))" 

    - name: Benchmarks
      uses: CodSpeedHQ/action@658a901452bb54c799643e060733b7afe9121b8d # v4
      with:
        mode: instrumentation
        run: |
          cd benchmarks
          max_attempts=3
          attempt=1
          until [ $attempt -gt $max_attempts ]
          do
              make bench && break
              attempt=$((attempt + 1))
              sleep 5
          done
  
    - name: Test Julia
      if: matrix.build_julia == '1' && matrix.precision_opt == ''
      run: |
        for DIR in julia/nf*t julia/fastsum; do
          cd $DIR
          for NAME in simple_test*.jl; do
            julia -q "$NAME"
          done
          cd ../..
        done
    
    - name: Test Octave
      if: matrix.build_octave == '1'
      run: |
        for DIR in matlab/nf*t matlab/fastsum; do
          cd $DIR
          for NAME in simple_test*.m; do
            $OCTAVE --eval="run('$NAME')"
          done
          cd ../..
        done

    - name: Collect core dumps and binaries
      if: failure()
      run: |
        # Extract binary paths from core dumps and copy them
        for corefile in /cores/*.*.*; do
          if [ -f "$corefile" ]; then
            echo "Processing $corefile"
            
            # Get the binary path from the core dump
            binary=$(file "$corefile" | grep -oP "from '[^']*'" | cut -d"'" -f2)
            
            # Alternative method using gdb (more reliable)
            if command -v gdb &> /dev/null; then
              binary=$(gdb -quiet -batch -c "$corefile" 2>/dev/null | grep "Core was generated by" | sed "s/Core was generated by \`\(.*\)'.*/\1/" | awk '{print $1}')
            fi
            
            echo "Binary: $binary"
            
            # Copy the binary if it exists
            if [ -n "$binary" ] && [ -f "$binary" ]; then
              cp "$binary" /cores/
              echo "Copied binary: $binary"
              
              # Also copy any shared libraries if needed
              ldd "$binary" 2>/dev/null | grep "=>" | awk '{print $3}' | while read lib; do
                if [ -f "$lib" ]; then
                  cp --parents "$lib" /cores/ 2>/dev/null || true
                fi
              done
            fi
          fi
        done
        
        ls -lah /cores/

    - name: Upload core dumps
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coredumps-${{ github.run_id }}
        path: /cores/
        if-no-files-found: warn
        retention-days: 7

    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@024bc4b64d997ca9da86833c6b9548c55c620e40 # v1
      with:
        report-path: './tests/junit.xml'
        integrations-config: |
          {
            "junit-to-ctrf": {
              "enabled": true,
              "action": "convert",
              "options": {
                "output": "./ctrf-reports/ctrf-report.json",
                "toolname": "junit-to-ctrf",
                "useSuiteName": false,
                "env": {
                  "appName": "nfft"
                }
              }
            }
          }
      if: always()

  distcheck:
    runs-on: ubuntu-latest
    name: "distcheck"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update        

    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          build-essential
          cmake
          libfftw3-dev
          libcunit1-dev 
          doxygen 
          doxygen-latex 
          graphviz

    - name: Bootstrap
      run: ./bootstrap.sh
    
    - name: Configure
      run: ./configure --enable-all --enable-exhaustive-unit-tests
    
    - name: Distcheck
      run: make distcheck
