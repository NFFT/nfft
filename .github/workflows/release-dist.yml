name: Release Dist

# Builds and attests the distribution archive. Releases are immutable once
# published, so the Release workflow attaches the archive before it publishes.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build the archive from"
        required: true
        type: string
      version-type:
        description: "Version suffix, e.g. -rc1, empty for the final release"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-dist-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    name: "dist"
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Set version type
      if: inputs.version-type != ''
      env:
        VERSION_TYPE: ${{ inputs.version-type }}
      run: |
        [[ $VERSION_TYPE =~ ^-rc[0-9]+$ ]] || { echo "::error::Bad version type '$VERSION_TYPE'."; exit 1; }
        sed -i "s/^m4_define(\[nfft_version_type\], \[.*\])$/m4_define([nfft_version_type], [$VERSION_TYPE])/" configure.ac
        grep -qxF "m4_define([nfft_version_type], [$VERSION_TYPE])" configure.ac

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake libfftw3-dev libcunit1-dev doxygen doxygen-latex graphviz

    - name: Bootstrap
      run: ./bootstrap.sh

    - name: Configure
      run: ./configure --enable-all

    - name: Distcheck
      run: make distcheck

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: nfft-*.tar.gz
        if-no-files-found: error

  # Signs the archive digest. Runs no build code.
  attest:
    needs: dist
    runs-on: ubuntu-latest
    name: "attest"
    permissions:
      id-token: write  # Required to request the Sigstore signing certificate.
      attestations: write  # Required to store the attestation.
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist

    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: nfft-*.tar.gz
        create-storage-record: false
