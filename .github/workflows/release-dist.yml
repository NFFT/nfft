name: Release Dist

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the archive to"
        required: true

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    name: "dist"
    permissions:
      contents: write  # Required to upload release assets.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        ref: ${{ env.TAG }}
        persist-credentials: false

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update

    - name: Install dependencies
      uses: dsx137/deb-cache@caf71786c0050ce140ac752de004d7c1343d4363 # main
      with:
        PACKAGES: |
          build-essential
          cmake
          libfftw3-dev
          libcunit1-dev
          doxygen
          doxygen-latex
          graphviz

    - name: Bootstrap
      run: ./bootstrap.sh

    - name: Configure
      run: ./configure --enable-all

    - name: Distcheck
      run: make distcheck

    - name: Upload archive to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$TAG" nfft-*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
