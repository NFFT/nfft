name: Release Dist

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the archive to"
        required: true

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    name: "dist"
    permissions:
      contents: write  # Required to upload release assets.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        ref: ${{ env.TAG }}
        persist-credentials: false

    - name: Disable initramfs update
      run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

    - name: Disable man-db update
      run: sudo rm -f /var/lib/man-db/auto-update

    - name: Install dependencies
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: build-essential cmake libfftw3-dev libcunit1-dev doxygen doxygen-latex graphviz
        version: 1.0

    - name: Bootstrap
      run: ./bootstrap.sh

    - name: Configure
      run: ./configure --enable-all

    - name: Distcheck
      run: make distcheck

    - name: Upload archive to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "$TAG" nfft-*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
