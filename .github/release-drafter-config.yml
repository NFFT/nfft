# The workflow passes an explicit name and tag per draft, so no template here.
filter-by-commitish: true
categories:
  - title: 'Added'
    labels:
      - 'feat'
  - title: 'Changed'
    labels:
      - 'refactor'
      - 'style'
  - title: 'Removed'
    labels:
      - 'removal'
  - title: 'Fixed'
    labels:
      - 'bug'
      - 'fix'
  - title: 'Deprecated'
    labels:
      - 'deprecation'
  - title: Documentation
    labels:
      - 'docs'
  - title: Chores
    labels:
      - 'chore'
template: |
  # What’s Changed
  $CHANGES
