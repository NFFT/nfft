# The workflow passes an explicit name and tag per draft, so no template here.
filter-by-commitish: true
categories:
  - title: 'Added'
    when:
      labels:
        - 'added'
  - title: 'Changed'
    when:
      labels:
        - 'changed'
  - title: 'Removed'
    when:
      labels:
        - 'removed'
  - title: 'Fixed'
    when:
      labels:
        - 'fixed'
  - title: 'Chores'
    when:
      labels:
        - 'chore'
template: |
  # What’s Changed
  $CHANGES
